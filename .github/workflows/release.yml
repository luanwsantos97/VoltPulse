name: Build & Release VoltPulse

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag or default
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF.Replace("refs/tags/v", "")
          } else {
            $ver = "1.0.4"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Validate JS syntax
        shell: pwsh
        run: |
          node --check ui/i18n.js
          node --check ui/app.js

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build VoltPulse, Portable ZIP, Windows Installer & SHA256SUMS
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1 -ReleaseZip -Installer -Version "${{ steps.meta.outputs.version }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoltPulse-v${{ steps.meta.outputs.version }}-win-x64
          path: |
            releases/VoltPulse-Setup-v*.exe
            releases/VoltPulse-v*.zip
            releases/SHA256SUMS.txt

  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VoltPulse-v${{ needs.build-windows.outputs.version }}-win-x64
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/VoltPulse-Setup-v*.exe
            release-assets/VoltPulse-v*.zip
            release-assets/SHA256SUMS.txt
            docs/Guia-Didatico-VoltPulse.pdf
